version: '3.9'

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: pharmasmart_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pharmasmart_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yassine2004
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pharmasmart_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pharmasmart_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django Backend ──────────────────────────────────────────────────────────
  backend:
    image: hyassine2004/pharmasmart-backend:latest
    container_name: pharmasmart_backend
    restart: unless-stopped
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --access-logfile -"
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=pharmasmart-super-secret-key-change-in-production-2024
      - DOCKER=True
      - DEBUG=False
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=yassine2004
      - DB_NAME=pharmasmart_db
      - REDIS_URL=redis://redis:6379
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,pharmasmart_backend
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - DEFAULT_FROM_EMAIL=noreply@pharmasmart.ma
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=587
      - EMAIL_HOST_USER=
      - EMAIL_HOST_PASSWORD=
      - GOOGLE_OAUTH2_KEY=
      - GOOGLE_OAUTH2_SECRET=
      - ANTHROPIC_API_KEY=
      - GOOGLE_MAPS_API_KEY=
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── React Frontend + Nginx ──────────────────────────────────────────────────
  frontend:
    image: hyassine2004/pharmasmart-frontend:latest
    container_name: pharmasmart_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_files:
  static_files:
