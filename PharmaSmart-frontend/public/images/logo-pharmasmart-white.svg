<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140">
  <!-- Circle background -->
  <circle cx="70" cy="65" r="58" fill="rgba(255,255,255,0.12)"/>
  <!-- Capsule -->
  <g transform="translate(42, 30) rotate(-25)">
    <rect x="0" y="0" width="58" height="30" rx="15" fill="white" opacity="0.95"/>
    <rect x="0" y="0" width="29" height="30" rx="15" fill="#E74C3C" opacity="0.9"/>
  </g>
  <!-- Chart bars -->
  <rect x="85" y="52" width="9" height="26" rx="2" fill="white" opacity="0.7"/>
  <rect x="98" y="40" width="9" height="38" rx="2" fill="white" opacity="0.8"/>
  <rect x="111" y="28" width="9" height="50" rx="2" fill="white" opacity="0.9"/>
  <!-- Arrow going up -->
  <polyline points="83,54 112,26 120,30" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <!-- Chat bot icon -->
  <g transform="translate(130, 42)">
    <rect x="0" y="0" width="38" height="30" rx="8" fill="white" opacity="0.85"/>
    <circle cx="12" cy="13" r="3.5" fill="#0B6E4F"/>
    <circle cx="26" cy="13" r="3.5" fill="#0B6E4F"/>
    <rect x="9" y="20" width="20" height="2.5" rx="1.25" fill="#0B6E4F" opacity="0.5"/>
  </g>
</svg>
