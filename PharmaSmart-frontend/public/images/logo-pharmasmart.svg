<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B6E4F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14A76C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B4965;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3498DB;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Circle background -->
  <circle cx="100" cy="100" r="90" fill="url(#grad1)" opacity="0.15"/>
  <circle cx="100" cy="100" r="75" fill="url(#grad1)" opacity="0.1"/>
  <!-- Medical cross -->
  <rect x="22" y="50" width="28" height="56" rx="4" fill="#0B6E4F"/>
  <rect x="8" y="64" width="56" height="28" rx="4" fill="#0B6E4F"/>
  <!-- Capsule -->
  <g transform="translate(85, 55) rotate(-30)">
    <rect x="0" y="0" width="70" height="35" rx="17.5" fill="white" stroke="#0B6E4F" stroke-width="2"/>
    <rect x="0" y="0" width="35" height="35" rx="17.5" fill="#0B6E4F"/>
  </g>
  <!-- Chart bars -->
  <rect x="70" y="70" width="10" height="30" rx="2" fill="url(#grad2)"/>
  <rect x="84" y="55" width="10" height="45" rx="2" fill="url(#grad2)"/>
  <rect x="98" y="40" width="10" height="60" rx="2" fill="url(#grad2)"/>
  <!-- Arrow -->
  <polyline points="68,72 100,38 108,42" fill="none" stroke="#1B4965" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Chat bot icon -->
  <g transform="translate(130, 80)">
    <rect x="0" y="0" width="45" height="35" rx="10" fill="url(#grad2)"/>
    <circle cx="14" cy="16" r="4" fill="white"/>
    <circle cx="31" cy="16" r="4" fill="white"/>
    <rect x="10" y="24" width="25" height="3" rx="1.5" fill="white" opacity="0.7"/>
  </g>
  <!-- Decorative dots -->
  <circle cx="60" cy="38" r="4" fill="#14A76C" opacity="0.7"/>
  <circle cx="140" cy="58" r="3" fill="#3498DB" opacity="0.6"/>
  <circle cx="48" cy="120" r="5" fill="#0B6E4F" opacity="0.4"/>
  <circle cx="165" cy="75" r="2.5" fill="#1B4965" opacity="0.5"/>
  <!-- Text -->
  <text x="100" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0B6E4F">Pharma</text>
  <text x="100" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="bold">
    <tspan fill="#0B6E4F">Pharma</tspan><tspan fill="#1B4965">Smart</tspan>
  </text>
  <text x="100" y="172" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="7" fill="#666" letter-spacing="2">GESTION INTELLIGENTE</text>
</svg>
